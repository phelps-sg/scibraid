# Publishes to PyPI when a GitHub release is published, using PyPI trusted
# publishing (no token). One-time setup on PyPI: add a publisher for project
# `scibraid`, owner `phelps-sg`, repository `scibraid`, workflow `publish.yml`,
# environment `pypi`.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The tag does not set the version; pyproject.toml does. A release tagged ahead of the
      # version bump builds the previous version's files, which PyPI refuses as already uploaded.
      - name: Check that the release tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          plugin=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$plugin" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME, pyproject.toml ($version) and plugin.json ($plugin) disagree. Bump the version in pyproject.toml and .claude-plugin/plugin.json, run 'uv lock', commit, and tag that commit."
            exit 1
          fi
      - run: uv run pytest
      - run: uv build
      - run: uv publish
